<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your bag | DESKOBS</title><meta name="description" content="Review your bag and check out."><meta name="theme-color" content="#1c1c1c"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c1c1c'/%3E%3Cpath d='M10 8h6a8 8 0 0 1 0 16h-6z' fill='none' stroke='%23ff5a1f' stroke-width='3'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="pages.css"><script src="products.js" defer></script><script src="site.js" defer></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script><script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script><script src="animations.js" defer></script></head>
<body data-page="cart"><a class="skip-link" href="#main">Skip to content</a><div id="hdr"></div>
<main id="main">
<div class="container"><div class="section"><h1 class="page-title">Your bag</h1></div>
<div class="notice" id="done" hidden><b>Your order message is ready.</b> Send it in WhatsApp and we will confirm stock and delivery there. <button class="link" id="clear" type="button">Clear bag</button></div><div class="cart-layout"><div id="lines"></div>
<aside class="summary" id="checkout"><p class="ship-note" id="ship-note"></p><div class="bar" id="bar" role="progressbar" aria-label="Progress to free delivery" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="bar-fill"></span></div><div class="sum-row"><span>Subtotal</span><span id="s1"></span></div><div class="sum-row"><span>Delivery (free above ₹2,000)</span><span id="s2"></span></div><div class="sum-row t"><span>Total</span><span id="s3"></span></div>
<form id="order" style="margin-top:16px" onsubmit="return false"><label>Name<input name="name" required autocomplete="name"></label><label>Phone<input name="phone" type="tel" required autocomplete="tel"></label><label>Delivery address<textarea name="address" rows="3" required></textarea></label><label>Discount code (optional)<input id="code" autocomplete="off" maxlength="20"></label><fieldset class="paymode"><legend>Payment</legend><label class="check"><input type="radio" name="pay" value="UPI" checked> UPI</label><label class="check"><input type="radio" name="pay" value="COD"> Cash on delivery</label></fieldset></form>
<div class="pay"><button class="btn" id="place" type="button">Place order</button><button class="btn accent" id="wa" type="button">Order on WhatsApp</button><button class="btn ghost" id="upi" type="button">Pay with UPI</button></div></aside></div></div>
</main><div id="ftr"></div><div id="toast" class="toast" role="status"></div></body></html>
